<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Iniciar sesión — Control de Calidad</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
<style>
  body { font-family: "Plus Jakarta Sans", sans-serif; }
  h1, h2, .titulo { font-family: "Plus Jakarta Sans", sans-serif; font-weight: 800; }
  .oculto { display: none !important; }
  input::-ms-reveal, input::-ms-clear { display: none; }
</style>
</head>
<body class="bg-[#fbf5ec] min-h-screen flex items-center justify-center p-4">

<div class="bg-white rounded-[1.4rem] shadow-2xl w-full max-w-sm p-8 flex flex-col gap-5" id="tarjetaLogin">
  <div class="flex items-center gap-3">
    <div class="w-11 h-11 rounded-xl bg-[#5b46d6] flex items-center justify-center shrink-0">
      <span class="material-symbols-outlined text-[#2b2156] text-[24px]">shield</span>
    </div>
    <div class="flex flex-col">
      <span class="titulo font-bold text-[#2b2156] text-lg leading-tight">Control de Calidad</span>
      <span class="text-[11px] text-[#6b6485] uppercase tracking-wider font-semibold">Universitaria de Colombia</span>
    </div>
  </div>

  <form id="formLogin" class="flex flex-col gap-4" autocomplete="off">
    <div class="flex flex-col gap-1">
      <label class="text-sm font-semibold text-[#2b2156]" for="correo">Correo electrónico</label>
      <input class="w-full bg-[#fdf8f1] border border-[#e6ddf5] rounded-lg px-4 py-2.5 text-[#2b2156] focus:outline-none focus:ring-2 focus:ring-[#5b46d6]" id="correo" type="email" autocomplete="off" required />
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-sm font-semibold text-[#2b2156]" for="clave">Contraseña</label>
      <div class="relative">
        <input class="w-full bg-[#fdf8f1] border border-[#e6ddf5] rounded-lg px-4 py-2.5 pr-10 text-[#2b2156] focus:outline-none focus:ring-2 focus:ring-[#5b46d6]" id="clave" type="password" autocomplete="new-password" required />
        <button type="button" class="absolute right-2 top-1/2 -translate-y-1/2 text-[#9b93b5]" id="btnOjoClave" aria-label="Mostrar contraseña">
          <span class="material-symbols-outlined text-[20px]">visibility</span>
        </button>
      </div>
    </div>
    <p class="oculto text-sm text-red-600" id="errorLogin"></p>
    <button class="w-full bg-[#5b46d6] text-white font-bold py-2.5 rounded-lg flex items-center justify-center gap-2 hover:opacity-90 transition-opacity" type="submit">
      <span class="material-symbols-outlined text-[18px]">login</span> Ingresar
    </button>
  </form>

  <p class="text-center text-sm text-[#6b6485]">
    ¿No tienes cuenta? <a class="text-[#5b46d6] font-semibold" href="/registro/">Regístrate aquí</a>
  </p>
</div>

<!-- Paso 2: verificacion facial -->
<div class="oculto fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" id="modalRostro">
  <div class="bg-white rounded-[1.4rem] shadow-2xl w-full max-w-md p-6 flex flex-col gap-4">
    <h2 class="titulo font-bold text-lg text-[#2b2156] flex items-center gap-2">
      <span class="material-symbols-outlined">face</span> Verificación de rostro
    </h2>
    <p class="text-sm text-[#6b6485]">Activa tu cámara y mira de frente. Comprobamos que el rostro coincida con el de tu registro.</p>

    <div class="relative rounded-xl overflow-hidden bg-[#231a47] aspect-[3/4] max-h-[55vh] mx-auto w-full">
      <!-- Espejo solo visual (como un selfie); la guia analiza el video original. -->
      <video id="video" class="absolute inset-0 w-full h-full object-cover -scale-x-100" autoplay playsinline muted></video>
      <canvas id="guiaLogin" class="absolute inset-0 w-full h-full object-cover -scale-x-100 pointer-events-none"></canvas>
      <canvas id="canvas" class="hidden"></canvas>
    </div>
    <p class="text-sm font-semibold text-center rounded-lg px-3 py-2 bg-[#fdf8f1] border border-[#e6ddf5] text-[#2b2156]" id="mensajeGuiaLogin">Cargando guía de cámara…</p>

    <p class="oculto text-sm text-red-600" id="errorRostro"></p>
    <p class="oculto text-sm text-[#0f9d68] font-semibold" id="okRostro"></p>

    <div class="flex gap-3">
      <button class="flex-1 py-2.5 rounded-lg font-semibold bg-[#fdf8f1] border border-[#e6ddf5] text-[#2b2156]" id="btnCancelarRostro" type="button">Cancelar</button>
      <button class="flex-1 py-2.5 rounded-lg font-semibold bg-[#5b46d6] text-white flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed" id="btnCapturarRostro" type="button" disabled>
        <span class="material-symbols-outlined text-[18px]">camera</span> Verificar
      </button>
    </div>
  </div>
</div>

<script>
const formLogin = document.getElementById("formLogin");
const errorLogin = document.getElementById("errorLogin");
const modalRostro = document.getElementById("modalRostro");
const errorRostro = document.getElementById("errorRostro");
const okRostro = document.getElementById("okRostro");
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const btnOjoClave = document.getElementById("btnOjoClave");
const claveInput = document.getElementById("clave");

btnOjoClave.addEventListener("click", () => {
  const mostrar = claveInput.type === "password";
  claveInput.type = mostrar ? "text" : "password";
  btnOjoClave.querySelector(".material-symbols-outlined").textContent = mostrar ? "visibility_off" : "visibility";
});

let stream = null;
let datosSesionPendiente = null; // {usuario_id, nombre, rol}

// No se guardan usuarios ni contraseñas: los campos se limpian al cargar la pagina (incluido
// cuando el navegador la restaura desde su cache al volver atras) y apenas se envian.
function limpiarCampos() {
  document.getElementById("correo").value = "";
  claveInput.value = "";
  claveInput.type = "password";
  btnOjoClave.querySelector(".material-symbols-outlined").textContent = "visibility";
}
window.addEventListener("pageshow", limpiarCampos);

// Guia con ovalo (ver /comun/guia-rostro.js): "Verificar" solo se habilita con la cara de
// frente y dentro del ovalo.
const mensajeGuia = document.getElementById("mensajeGuiaLogin");
const btnVerificarRostro = document.getElementById("btnCapturarRostro");
let guia = null;
let verificando = false;

function mostrarMensajeGuia(texto, valido) {
  mensajeGuia.textContent = texto;
  mensajeGuia.className =
    "text-sm font-semibold text-center rounded-lg px-3 py-2 " +
    (valido ? "bg-[#d1fae5] text-[#065f46]" : "bg-[#fdf8f1] border border-[#e6ddf5] text-[#2b2156]");
}

async function abrirCamara() {
  btnVerificarRostro.disabled = true;
  mostrarMensajeGuia("Cargando guía de cámara…", false);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    video.srcObject = stream;
    const { crearGuiaEnVivo } = await import("/comun/guia-rostro.js");
    guia ??= await crearGuiaEnVivo({
      video,
      canvas: document.getElementById("guiaLogin"),
      alCambiar: ({ valido, mensaje }) => {
        if (!verificando) btnVerificarRostro.disabled = !valido;
        mostrarMensajeGuia(mensaje, valido);
      },
    });
    guia.setAngulo("frontal");
    guia.iniciar();
  } catch (err) {
    errorRostro.textContent = "No se pudo acceder a la cámara: " + err.message;
    errorRostro.classList.remove("oculto");
  }
}

function cerrarCamara() {
  guia?.detener();
  stream?.getTracks().forEach((t) => t.stop());
  stream = null;
}

formLogin.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  errorLogin.classList.add("oculto");
  try {
    const resp = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ correo: document.getElementById("correo").value.trim(), clave: claveInput.value }),
    });
    limpiarCampos();
    const datos = await resp.json();
    if (!resp.ok) throw new Error(datos.detail || "No se pudo iniciar sesión");

    datosSesionPendiente = datos;
    modalRostro.classList.remove("oculto");
    errorRostro.classList.add("oculto");
    okRostro.classList.add("oculto");
    await abrirCamara();
  } catch (err) {
    errorLogin.textContent = err.message;
    errorLogin.classList.remove("oculto");
  }
});

document.getElementById("btnCancelarRostro").addEventListener("click", () => {
  cerrarCamara();
  modalRostro.classList.add("oculto");
  datosSesionPendiente = null;
});

document.getElementById("btnCapturarRostro").addEventListener("click", async () => {
  if (!stream || !datosSesionPendiente || btnVerificarRostro.disabled) return;
  errorRostro.classList.add("oculto");

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);

  canvas.toBlob(async (blob) => {
    const form = new FormData();
    form.append("usuario_id", datosSesionPendiente.usuario_id);
    form.append("nombre", datosSesionPendiente.nombre);
    form.append("rol", datosSesionPendiente.rol);
    form.append("foto", blob, "rostro.jpg");

    const botonVerificar = document.getElementById("btnCapturarRostro");
    botonVerificar.disabled = true;
    verificando = true;
    okRostro.textContent = "Analizando rostro, un momento…";
    okRostro.classList.remove("oculto");
    try {
      const resp = await fetch("/api/auth/verificar-rostro", { method: "POST", body: form });
      const datos = await resp.json();
      if (!resp.ok) throw new Error(datos.detail || "No se pudo verificar el rostro");

      okRostro.textContent = "¡Rostro verificado! Redirigiendo…";
      okRostro.classList.remove("oculto");
      sessionStorage.setItem("qamonitor.token", datos.token);
      sessionStorage.setItem("qamonitor.nombre", datos.nombre);
      sessionStorage.setItem("qamonitor.rol", datos.rol);
      cerrarCamara();
      setTimeout(() => (window.location.href = datos.destino), 700);
    } catch (err) {
      okRostro.classList.add("oculto");
      errorRostro.textContent = err.message;
      errorRostro.classList.remove("oculto");
    } finally {
      verificando = false;
      // Se vuelve a exigir que la guia confirme la posicion antes de permitir otro intento.
      botonVerificar.disabled = true;
      guia?.setAngulo("frontal");
    }
  }, "image/jpeg", 0.92);
});
</script>
</body>
</html>
