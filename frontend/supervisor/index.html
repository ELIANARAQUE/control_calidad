<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel de Supervisor</title>
  <link rel="stylesheet" href="style.css?v=1" />
</head>
<body>
  <header class="encabezado">
    <div class="titulo">
      <h1>Control de calidad</h1>
      <span class="subtitulo">Monitoreo en vivo por estación</span>
    </div>
    <div class="estado" id="estado">
      <span class="punto" id="punto"></span>
      <span id="estadoTexto">Conectando…</span>
    </div>
  </header>

  <section class="resumen" id="resumen">
    <div class="tarjeta-resumen">
      <span class="valor" id="statEstaciones">0</span>
      <span class="etiqueta">Estaciones activas</span>
    </div>
    <div class="tarjeta-resumen">
      <span class="valor" id="statAlertas">0</span>
      <span class="etiqueta">Alertas hoy</span>
    </div>
    <div class="tarjeta-resumen">
      <span class="valor" id="statPendientes">0</span>
      <span class="etiqueta">Sin revisar</span>
    </div>
    <div class="tarjeta-resumen">
      <span class="valor" id="statTranscripciones">0</span>
      <span class="etiqueta">Frases transcritas</span>
    </div>
  </section>

  <main class="grid-estaciones" id="grid"></main>

  <p class="vacio oculto" id="vacio">Todavía no se ha conectado ninguna estación.</p>

  <script src="client.js?v=4"></script>
</body>
</html>
